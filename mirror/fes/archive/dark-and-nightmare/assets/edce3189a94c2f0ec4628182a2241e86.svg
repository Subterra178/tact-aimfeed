<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="183.3011" viewBox="0,0,436.23145,183.3011"><g transform="translate(-15.03011,-73.4814)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは視聴覚を</tspan><tspan x="0" dy="48px">向上させられるのが</tspan><tspan x="0" dy="48px">特徴だぜ。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">遠くの敵を探したり、</tspan><tspan x="0" dy="48px">茂みの敵を見つけたり</tspan><tspan x="0" dy="48px">出来るようになるから</tspan><tspan x="0" dy="48px">より安全に行動できるぜ</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">敵に会わずに一方的に</tspan><tspan x="0" dy="48px">攻撃したい人にお勧めだ</tspan></text><text transform="translate(326.03013,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Sense potion</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Buff</tspan></text><path d="M94.32171,87.87272h186.70844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>