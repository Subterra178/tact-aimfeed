<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="169.68589" viewBox="0,0,436.23145,169.68589"><g transform="translate(-15.03011,-73.48141)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは爆破攻撃耐性</tspan><tspan x="0" dy="48px">を大幅に上げる陣を</tspan><tspan x="0" dy="48px">敷くぜ。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">複数人に効果があるから</tspan><tspan x="0" dy="48px">拠点を築くときに</tspan><tspan x="0" dy="48px">使えるぜ。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">ガード系と組み合わせて</tspan><tspan x="0" dy="48px">使うといいかもな！</tspan></text><text transform="translate(326.03013,101.065) scale(0.39835,0.39835)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Bomb tower</tspan></text><path d="M18.03011,87.87273h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49062) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Team</tspan></text><path d="M102.32173,87.87273h178.70844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>