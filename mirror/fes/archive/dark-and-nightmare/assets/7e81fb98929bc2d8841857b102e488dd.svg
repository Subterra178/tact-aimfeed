<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="455.0364" height="152.43345" viewBox="0,0,455.0364,152.43345"><g transform="translate(-15.0301,-73.46264)"><g stroke-miterlimit="10"><text transform="translate(326.03011,117.6269) scale(0.25854,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器はスコープがついて</tspan><tspan x="0" dy="46.15px">いて連射ができる武器だよ。</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">弾が少しホーミングするから</tspan><tspan x="0" dy="46.15px">遠距離ではかなりの強さを</tspan><tspan x="0" dy="46.15px">発揮するよ。</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">どんどん相手の正気度を</tspan><tspan x="0" dy="46.15px">削って有利に戦闘を進めよう。</tspan></text><text transform="translate(324.03011,102.70633) scale(0.38657,0.38657)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Dark combat rifle</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Dark</tspan></text><path d="M95.3312,87.87272h185.69891" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>