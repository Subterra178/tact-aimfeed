<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="435.89463" height="167.47748" viewBox="0,0,435.89463,167.47748"><g transform="translate(-15.0301,-73.46265)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器はすぐに</tspan><tspan x="0" dy="48px">着弾するのが特徴だ。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">機動力と当てやすさ</tspan><tspan x="0" dy="48px">に特化したモデルで、</tspan><tspan x="0" dy="48px">メインとして使うことが</tspan><tspan x="0" dy="48px">できるよ。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">少し低い火力を</tspan><tspan x="0" dy="48px">カバーできると強いね！</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Dark</tspan></text><path d="M95.3312,87.87272h185.69891" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,101.42316) scale(0.36851,0.36851)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Dark impact gun</tspan></text></g></g></svg>