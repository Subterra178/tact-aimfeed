<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="445.60603" height="175.8204" viewBox="0,0,445.60603,175.8204"><g transform="translate(-15.0301,-73.46264)"><g stroke-miterlimit="10"><text transform="translate(325.53009,117.6269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは非常に強力な</tspan><tspan x="0" dy="46.150000000000006px">爆発を起こせるのが</tspan><tspan x="0" dy="46.150000000000006px">特徴だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">範囲が広く、正気度を</tspan><tspan x="0" dy="46.150000000000006px">大量に減らすため、</tspan><tspan x="0" dy="46.150000000000006px">戦闘中に一発逆転を</tspan><tspan x="0" dy="46.150000000000006px">狙いやすい。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">ただし、ダメージはとても</tspan><tspan x="0" dy="46.150000000000006px">低いため注意だ。</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Nightmare</tspan></text><path d="M150.3312,87.87272h130.69891" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,101.8604) scale(0.33206,0.33206)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Nightmare bottle</tspan></text></g></g></svg>