<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="169.68589" viewBox="0,0,436.23145,169.68589"><g transform="translate(-15.03011,-73.48141)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは瞬間移動</tspan><tspan x="0" dy="48px">できるのが特徴だぜ。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">移動距離が長く、強力な</tspan><tspan x="0" dy="48px">代わりに体力を消費する</tspan><tspan x="0" dy="48px">から使用後は周囲に注意</tspan><tspan x="0" dy="48px">したほうがいいぜ。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">距離を取りながら戦う</tspan><tspan x="0" dy="48px">魔導士にお勧めだぜ。</tspan></text><text transform="translate(326.03013,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Magic warp</tspan></text><path d="M18.03011,87.87273h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49062) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Spell</tspan></text><path d="M96.82173,87.87273h184.20844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>