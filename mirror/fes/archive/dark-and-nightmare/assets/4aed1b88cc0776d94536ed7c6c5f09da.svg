<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="435.89463" height="167.47748" viewBox="0,0,435.89463,167.47748"><g transform="translate(-15.0301,-73.46264)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は拡散する</tspan><tspan x="0" dy="48px">透明な弾を出せるのが</tspan><tspan x="0" dy="48px">特徴だ。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">攻撃範囲が広く、</tspan><tspan x="0" dy="48px">多少エイムが悪くても</tspan><tspan x="0" dy="48px">使えるのが特徴だ。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">とにかく攻撃を</tspan><tspan x="0" dy="48px">当てたい人にお勧めだ。</tspan></text><path d="M31.0301,87.87272h-13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Dark</tspan></text><path d="M95.3312,87.87272h185.69891" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,101.94373) scale(0.32512,0.32512)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Invisible shot gun</tspan></text></g></g></svg>