<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="424.88546" height="191.144" viewBox="0,0,424.88546,191.144"><g transform="translate(-15.0301,-73.4814)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">この武器は攻撃能力が</tspan><tspan x="0" dy="46.15px">あまりない代わりに、</tspan><tspan x="0" dy="46.15px">機動力や視野が広く、</tspan><tspan x="0" dy="46.15px">動きやすいモデルだよ</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">この武器を使用すると</tspan><tspan x="0" dy="46.15px">水の力で近くの壁を</tspan><tspan x="0" dy="46.15px">貫通する弾を打つこと</tspan><tspan x="0" dy="46.15px">ができるよ。</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">逃げ回って相手を</tspan><tspan x="0" dy="46.15px">一方的に攻撃しよう！</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Magic</tspan></text><path d="M107.43744,87.87272h173.59267" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,100.55839) scale(0.44057,0.44