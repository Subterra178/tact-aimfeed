<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23146" height="204.23447" viewBox="0,0,436.23146,204.23447"><g transform="translate(-15.0301,-73.4814)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">このジャンルは主に丸い</tspan><tspan x="0" dy="46.150000000000006px">範囲攻撃なのが特徴だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">壁を貫通するものも多い</tspan><tspan x="0" dy="46.150000000000006px">から、壁の向こうにいる</tspan><tspan x="0" dy="46.150000000000006px">敵を動かすことも</tspan><tspan x="0" dy="46.150000000000006px">できるぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">４つ編成に入れて超範囲</tspan><tspan x="0" dy="46.150000000000006px">攻撃をしてもよし、少し</tspan><tspan x="0" dy="46.150000000000006px">いれて、敵をうまく</tspan><tspan x="0" dy="46.150000000000006px">動かしながら</tspan><tspan x="0" dy="46.150000000000006px">戦ってもよしだぜ。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03011,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy=