<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="446.74063" height="162.72996" viewBox="0,0,446.74063,162.72996"><g transform="translate(-15.0301,-73.46265)"><g stroke-miterlimit="10"><text transform="translate(325.53009,117.6269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は二種類の</tspan><tspan x="0" dy="46.150000000000006px">弾を撃てるのが特徴だ</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">一つは敵の移動速度を</tspan><tspan x="0" dy="46.150000000000006px">低下させる弾、</tspan><tspan x="0" dy="46.150000000000006px">もう一つは威力が高く、</tspan><tspan x="0" dy="46.150000000000006px">正気度を多く下げる弾だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">二つの弾を使い分けて</tspan><tspan x="0" dy="46.150000000000006px">上手に使おう。</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Nightmare</tspan></text><path d="M150.3312,87.87272h130.69891" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,102.4854) scale(0.27998,0.27998)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Lost shooter &amp; Slow gun</tspan></text></g></g></svg>