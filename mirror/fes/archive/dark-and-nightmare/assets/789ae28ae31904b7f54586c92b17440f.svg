<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="447.35142" height="122.95861" viewBox="0,0,447.35142,122.95861"><g transform="translate(-15.03011,-73.46264)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このジャンルは正気度を</tspan><tspan x="0" dy="46.150000000000006px">回復することができるよ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">正気度が下がると能力が</tspan><tspan x="0" dy="46.150000000000006px">衰えるから、正気度を</tspan><tspan x="0" dy="46.150000000000006px">十分に保って有利に</tspan><tspan x="0" dy="46.150000000000006px">戦おう。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03011,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Sanity</tspan></text><path d="M107.70367,87.87272h173.32644" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03013,100.28667) scale(0.46321,0.46321)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Sanity</tspan></text></g></g></svg>