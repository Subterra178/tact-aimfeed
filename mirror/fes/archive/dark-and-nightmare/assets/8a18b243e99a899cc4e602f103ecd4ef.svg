<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="424.88546" height="178.05356" viewBox="0,0,424.88546,178.05356"><g transform="translate(-15.0301,-73.48141)"><g stroke-miterlimit="10"><path d="M18.0301,87.87273h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49062) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Magic</tspan></text><path d="M107.43744,87.87273h173.59267" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03009,117.12691) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器はレーザー</tspan><tspan x="0" dy="46.150000000000006px">攻撃を高速で行えるよ</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">火力が高いけれど、</tspan><tspan x="0" dy="46.150000000000006px">発射までに時間を</tspan><tspan x="0" dy="46.150000000000006px">要するから、扱うのが</tspan><tspan x="0" dy="46.150000000000006px">難しいよ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">拠点を破壊したり、</tspan><tspan x="0" dy="46.150000000000006px">敵の道を塞ぐときに</tspan><tspan x="0" dy="46.150000000000006px">使ってみてね。</tspan></text><text transform="translate(326.03011,100.5584) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Rapid laser</tspan></text></g></g></svg>