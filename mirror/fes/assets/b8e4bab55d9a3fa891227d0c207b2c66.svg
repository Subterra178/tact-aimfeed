<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="426.73634" height="203.99142" viewBox="0,0,426.73634,203.99142"><g transform="translate(-15.0301,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は自分の後ろ</tspan><tspan x="0" dy="46.150000000000006px">から毒を帯びた魔法剣</tspan><tspan x="0" dy="46.150000000000006px">を出せるぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">一度に二本も剣が出る</tspan><tspan x="0" dy="46.150000000000006px">上に、頻度も最上級で</tspan><tspan x="0" dy="46.150000000000006px">毒も付きやすいから、</tspan><tspan x="0" dy="46.150000000000006px">瞬間火力、継続火力</tspan><tspan x="0" dy="46.150000000000006px">共に高く仕上った</tspan><tspan x="0" dy="46.150000000000006px">逸品だぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">その代わりに非常に</tspan><tspan x="0" dy="46.150000000000006px">体力の消耗が激しいぜ</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Magic</tspan></text><path d="M107.43744,87.87272h173.59267" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,101.69524) scale(0.34583,0.34583)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Miracle of Nature</tspan></text></g></g></svg>