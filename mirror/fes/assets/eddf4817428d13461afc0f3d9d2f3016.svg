<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="175.3204" viewBox="0,0,436.23145,175.3204"><g transform="translate(-15.03011,-73.46265)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは冥界に命を</tspan><tspan x="0" dy="46.150000000000006px">貸しつける契約書だぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">大幅に体力を失うが、</tspan><tspan x="0" dy="46.150000000000006px">長期的に倍の体力を還元</tspan><tspan x="0" dy="46.150000000000006px">でき、再生力が無くても</tspan><tspan x="0" dy="46.150000000000006px">魔法が使えるぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">契約中は半分霊体だから</tspan><tspan x="0" dy="46.150000000000006px">衝撃でうっかりあの世に</tspan><tspan x="0" dy="46.150000000000006px">逝かないよう注意だな！</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Spell</tspan></text><text transform="translate(326.03013,100.28667) scale(0.46321,0.46321)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Soul contract</tspan></text><path d="M96.82172,87.87272h184.20844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>