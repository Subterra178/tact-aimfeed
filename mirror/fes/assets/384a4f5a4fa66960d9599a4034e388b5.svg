<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="424.65854" height="164.72007" viewBox="0,0,424.65854,164.72007"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このジャンルのサブは</tspan><tspan x="0" dy="46.150000000000006px">敵の弾丸を完全に</tspan><tspan x="0" dy="46.150000000000006px">消すことができるのが</tspan><tspan x="0" dy="46.150000000000006px">特徴です。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">敵味方関係なく消し</tspan><tspan x="0" dy="46.150000000000006px">ますが、消さない</tspan><tspan x="0" dy="46.150000000000006px">方向が存在するので、</tspan><tspan x="0" dy="46.150000000000006px">自分の有利な方向に</tspan><tspan x="0" dy="46.150000000000006px">張ることが大切です。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Guard</tspan></text><text transform="translate(326.03013,100.28667) scale(0.46321,0.46321)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Guard</tspan></text><path d="M110.32172,87.87272h170.70844" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>