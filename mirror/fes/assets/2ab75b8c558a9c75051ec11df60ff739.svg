<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="437.09786" height="183.05805" viewBox="0,0,437.09786,183.05805"><g transform="translate(-15.03011,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは自分の攻撃力</tspan><tspan x="0" dy="48px">を向上させられるのが</tspan><tspan x="0" dy="48px">特徴です。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">しかし、使うとめまいが</tspan><tspan x="0" dy="48px">するから、使うときは</tspan><tspan x="0" dy="48px">気を付ける必要が</tspan><tspan x="0" dy="48px">あります。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">とにかく攻撃力を</tspan><tspan x="0" dy="48px">上げたい人にお勧めです</tspan></text><text transform="translate(326.03013,100.68188) scale(0.43028,0.43028)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Sparkling drink</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Buff</tspan></text><path d="M94.32171,87.87272h186.70844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>