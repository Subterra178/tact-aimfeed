<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="447.57749" height="190.90097" viewBox="0,0,447.57749,190.90097"><g transform="translate(-15.03011,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03013,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は音が小さく、</tspan><tspan x="0" dy="46.150000000000006px">茂みの中に隠れながら</tspan><tspan x="0" dy="46.150000000000006px">打てて、しかも視野が広い</tspan><tspan x="0" dy="46.150000000000006px">のが特徴だぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">でも少し重たくて、威力</tspan><tspan x="0" dy="46.150000000000006px">も中程度だから、向かって</tspan><tspan x="0" dy="46.150000000000006px">くる敵を倒すことは簡単</tspan><tspan x="0" dy="46.150000000000006px">じゃないぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">戦況を見極めることが</tspan><tspan x="0" dy="46.150000000000006px">出来る人が使うといいな。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03011,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Rifle</tspan></text><path d="M88.65957,87.87272h192.37055" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(324.03013,101.07134) scale(0.39783,0.39783)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Dark Rifle</tspan></text></g></g></svg>