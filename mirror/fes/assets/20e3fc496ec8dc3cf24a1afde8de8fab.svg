<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="425.71308" height="177.81051" viewBox="0,0,425.71308,177.81051"><g transform="translate(-15.03009,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,99.3067) scale(0.37064,0.37064)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">CS machine gun</tspan></text><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は威力を</tspan><tspan x="0" dy="46.150000000000006px">捨て、機動力に特化</tspan><tspan x="0" dy="46.150000000000006px">したモデルだぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">軽いうえに、かなり</tspan><tspan x="0" dy="46.150000000000006px">視野が広いから、</tspan><tspan x="0" dy="46.150000000000006px">かなり扱いやすいぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">ただ、威力は物凄く</tspan><tspan x="0" dy="46.150000000000006px">低いから、気をつけろ</tspan><tspan x="0" dy="46.150000000000006px">よな!</tspan></text><path d="M18.03009,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03009,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Gun</tspan></text><path d="M88.65955,87.87272h192.37055" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>