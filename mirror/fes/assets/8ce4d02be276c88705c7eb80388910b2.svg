<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23146" height="190.90097" viewBox="0,0,436.23146,190.90097"><g transform="translate(-15.0301,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は刀身が細く、</tspan><tspan x="0" dy="46.150000000000006px">相手を「突く」ことに</tspan><tspan x="0" dy="46.150000000000006px">特化した剣だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">普通に攻撃するだけで</tspan><tspan x="0" dy="46.150000000000006px">なく、構えてチャージ</tspan><tspan x="0" dy="46.150000000000006px">することで強力な</tspan><tspan x="0" dy="46.150000000000006px">攻撃を放てるぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">機動力も高いから、</tspan><tspan x="0" dy="46.150000000000006px">敵を翻弄する立ち回り</tspan><tspan x="0" dy="46.150000000000006px">ができるぜ。</tspan></text><path d="M31.0301,87.87272h-13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Strike</tspan></text><path d="M109.3312,87.87272h171.69891" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Rapier</tspan></text></g></g></svg>