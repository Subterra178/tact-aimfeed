<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="424.88546" height="138.84301" viewBox="0,0,424.88546,138.84301"><g transform="translate(-15.0301,-73.46264)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このジャンルは</tspan><tspan x="0" dy="46.150000000000006px">正気度を少し減少</tspan><tspan x="0" dy="46.150000000000006px">させるのが特徴だよ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">正気度が下がると</tspan><tspan x="0" dy="46.150000000000006px">デバフがついて戦闘が</tspan><tspan x="0" dy="46.150000000000006px">不利になるから</tspan><tspan x="0" dy="46.150000000000006px">気を付けよう。</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#0021b7" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Dark</tspan></text><path d="M95.3312,87.87272h185.69891" fill="none" stroke="#0021b7" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Dark</tspan></text></g></g></svg>