<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="447.57745" height="151.62962" viewBox="0,0,447.57745,151.62962"><g transform="translate(-15.03011,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03009,98.84405) scale(0.41676,0.41676)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Icicle</tspan></text><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは相手を鈍化</tspan><tspan x="0" dy="46.150000000000006px">させられるのが特徴です。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">ダメージは低いが、３つ</tspan><tspan x="0" dy="46.150000000000006px">スタックできて</tspan><tspan x="0" dy="46.150000000000006px">使いやすいです。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">逃げる敵を逃がさない人に</tspan><tspan x="0" dy="46.150000000000006px">おすすめです。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Throw</tspan></text><path d="M112.70369,87.87272h168.32644" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>