<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23146" height="151.62962" viewBox="0,0,436.23146,151.62962"><g transform="translate(-15.0301,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このジャンルは攻撃力が</tspan><tspan x="0" dy="46.150000000000006px">高いうえ軽いのが特徴</tspan><tspan x="0" dy="46.150000000000006px">だぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">軽量設計だから、敵の</tspan><tspan x="0" dy="46.150000000000006px">攻撃を避けやすいぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">中距離での打ち合いで</tspan><tspan x="0" dy="46.150000000000006px">かなりの強さを誇るぜ。</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Rifle</tspan></text><path d="M93.12023,87.87272h187.90988" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,100.28667) scale(0.46321,0.46321)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Rifle</tspan></text></g></g></svg>