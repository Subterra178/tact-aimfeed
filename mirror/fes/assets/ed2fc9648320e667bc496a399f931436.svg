<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="435.89108" height="162.09631" viewBox="0,0,435.89108,162.09631"><g transform="translate(-15.03011,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03009,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Flash bomb</tspan></text><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは広範囲で</tspan><tspan x="0" dy="46.150000000000006px">大きな攻撃を仕掛け</tspan><tspan x="0" dy="46.150000000000006px">られるのが特徴です。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">大きな攻撃を一瞬で</tspan><tspan x="0" dy="46.150000000000006px">出せるのが強みです。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">狙撃をしている敵の奇襲</tspan><tspan x="0" dy="46.150000000000006px">や、追われている時に</tspan><tspan x="0" dy="46.150000000000006px">使うといいですよ。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Bomb</tspan></text><path d="M107.70369,87.87272h173.32644" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>