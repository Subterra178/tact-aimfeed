<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23148" height="151.93435" viewBox="0,0,436.23148,151.93435"><g transform="translate(-15.03011,-73.46264)"><g stroke-miterlimit="10"><text transform="translate(326.03012,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Tricker</tspan></text><text transform="translate(326.03012,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は敵にいたずら</tspan><tspan x="0" dy="46.150000000000006px">できるのが特徴だよ</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">敵に一瞬だけランダムな</tspan><tspan x="0" dy="46.150000000000006px">バフ、デバフを付与して</tspan><tspan x="0" dy="46.150000000000006px">混乱させられるよ</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">やりすぎて怒られない</tspan><tspan x="0" dy="46.150000000000006px">ように注意してね。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Rifle</tspan></text><path d="M281.03013,87.87272h-187.90988" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>