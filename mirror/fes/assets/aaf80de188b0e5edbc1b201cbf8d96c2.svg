<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="445.88599" height="165.5239" viewBox="0,0,445.88599,165.5239"><g transform="translate(-15.0301,-73.46265)"><g stroke-miterlimit="10"><text transform="translate(326.03011,117.6269) scale(0.25865,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この魔法武器は一定の距離を</tspan><tspan x="0" dy="46.150000000000006px">進むと爆発する弾を出せる</tspan><tspan x="0" dy="46.150000000000006px">のが特徴だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">爆発する前の弾はダメージが</tspan><tspan x="0" dy="46.150000000000006px">非常に低いが、爆発はとても</tspan><tspan x="0" dy="46.150000000000006px">ダメージが高い。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">扱うのがかなり難しいから、</tspan><tspan x="0" dy="46.150000000000006px">上級者向けの武器だよ。</tspan></text><text transform="translate(324.03011,103.70633) scale(0.38657,0.38657)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Dark grimoire</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Nightmare</tspan></text><path d="M150.3312,87.87272h130.69891" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>