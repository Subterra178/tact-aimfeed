<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="177.81051" viewBox="0,0,436.23145,177.81051"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は壁を貫通して</tspan><tspan x="0" dy="46.150000000000006px">大きな爆発を起こせる</tspan><tspan x="0" dy="46.150000000000006px">武器だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">爆風が大きいから、</tspan><tspan x="0" dy="46.150000000000006px">茂みにいる敵を</tspan><tspan x="0" dy="46.150000000000006px">あぶり出せるぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">茂みにいる敵に先制攻撃</tspan><tspan x="0" dy="46.150000000000006px">を与えたい人に</tspan><tspan x="0" dy="46.150000000000006px">おすすめだぜ。</tspan></text><text transform="translate(326.03011,98.70598) scale(0.35449,0.35449)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Grenade launcher</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03011,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Launcher</tspan></text><path d="M141.33121,87.87272h139.69891" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>