<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="435.66417" height="151.62962" viewBox="0,0,435.66417,151.62962"><g transform="translate(-15.0301,-73.76649)"><g stroke-miterlimit="10"><path d="M31.0301,87.87273h-13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49062) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Magic</tspan></text><path d="M107.43744,87.87273h173.59267" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03009,117.12691) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は棘を生や</tspan><tspan x="0" dy="46.150000000000006px">して攻撃するため、</tspan><tspan x="0" dy="46.150000000000006px">複数の敵を同時に</tspan><tspan x="0" dy="46.150000000000006px">攻撃できるのが特徴だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">二点バーストで</tspan><tspan x="0" dy="46.150000000000006px">当てやすいが、代償が</tspan><tspan x="0" dy="46.150000000000006px">多めだから気をつけて</tspan><tspan x="0" dy="46.150000000000006px">使えよな。</tspan></text><text transform="translate(326.03011,100.5584) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Magical Vein</tspan></text></g></g></svg>