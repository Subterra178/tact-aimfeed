<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="447.23708" height="203.99141" viewBox="0,0,447.23708,203.99141"><g transform="translate(-15.03011,-73.76649)"><g stroke-miterlimit="10"><text transform="translate(326.03009,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Sniper rifle</tspan></text><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は、スナイパー</tspan><tspan x="0" dy="46.150000000000006px">ライフルを改造して、</tspan><tspan x="0" dy="46.150000000000006px">相手に「流血」デバフ</tspan><tspan x="0" dy="46.150000000000006px">を与えられるようにした</tspan><tspan x="0" dy="46.150000000000006px">武器だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">一撃の威力は少ない</tspan><tspan x="0" dy="46.150000000000006px">けれど、与える総ダメージ</tspan><tspan x="0" dy="46.150000000000006px">はこちらが上だぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">でも一気にダメージを</tspan><tspan x="0" dy="46.150000000000006px">与えるわけじゃないから、</tspan><tspan x="0" dy="46.150000000000006px">漁夫の利に注意だな！</tspan></text><path d="M18.03011,87.87273h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49062) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Blood</tspan></text><path d="M107.70369,87.87273h173.32644" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>