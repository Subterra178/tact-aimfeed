<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23149" height="176.87242" viewBox="0,0,436.23149,176.87242"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03012,116.18881) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは地雷のモデル</tspan><tspan x="0" dy="46.150000000000006px">の中でも珍しい、指向性</tspan><tspan x="0" dy="46.150000000000006px">の地雷です。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">一方向にしか爆撃しない</tspan><tspan x="0" dy="46.150000000000006px">代わりに、威力と射程が</tspan><tspan x="0" dy="46.150000000000006px">優れた逸品です。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">指向性の地雷なので、</tspan><tspan x="0" dy="46.150000000000006px">使用するときは向きに</tspan><tspan x="0" dy="46.150000000000006px">気をつけましょう。</tspan></text><text transform="translate(326.03013,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Claymore</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Trap</tspan></text><path d="M91.70369,87.87272h189.32644" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>