<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="447.23708" height="183.05805" viewBox="0,0,447.23708,183.05805"><g transform="translate(-15.03011,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは自分の攻撃力</tspan><tspan x="0" dy="48px">を３回だけ上昇</tspan><tspan x="0" dy="48px">させられるのが特徴です。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">効果は３回しかないですが</tspan><tspan x="0" dy="48px">効果時間は長いので</tspan><tspan x="0" dy="48px">使いやすいです。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">とても大きい火力</tspan><tspan x="0" dy="48px">を出したい人にお勧め</tspan><tspan x="0" dy="48px">のサブです。</tspan></text><text transform="translate(326.03013,100.68188) scale(0.43028,0.43028)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Sword potion</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Buff</tspan></text><path d="M94.32171,87.87272h186.70844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>