<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="177.81051" viewBox="0,0,436.23145,177.81051"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">HP sniper rifle</tspan></text><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は銛を発射</tspan><tspan x="0" dy="46.150000000000006px">できるのが特徴だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">銛が敵に当たると、</tspan><tspan x="0" dy="46.150000000000006px">たまに敵の足を遅くする</tspan><tspan x="0" dy="46.150000000000006px">から、当たった瞬間に</tspan><tspan x="0" dy="46.150000000000006px">追撃を当てに行くと</tspan><tspan x="0" dy="46.150000000000006px">いいと思うぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">遠距離近距離両方で活躍</tspan><tspan x="0" dy="46.150000000000006px">したい人にいいな！</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03011,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Sniper</tspan></text><path d="M112.03143,87.87272h168.99868" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>