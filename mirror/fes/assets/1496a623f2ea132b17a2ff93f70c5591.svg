<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="424.88546" height="203.99142" viewBox="0,0,424.88546,203.99142"><g transform="translate(-15.0301,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このジャンルは主に</tspan><tspan x="0" dy="46.150000000000006px">魔法系の武器が</tspan><tspan x="0" dy="46.150000000000006px">そろっているぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">魔法と言うのは何かを</tspan><tspan x="0" dy="46.150000000000006px">代償にすることで</tspan><tspan x="0" dy="46.150000000000006px">使う事の出来る代物で</tspan><tspan x="0" dy="46.150000000000006px">効果もより高いんだ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">他にも、魔法武器を</tspan><tspan x="0" dy="46.150000000000006px">持っている時しか</tspan><tspan x="0" dy="46.150000000000006px">使えないサブ(スペル)</tspan><tspan x="0" dy="46.150000000000006px">などがあるぜ。</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Magic</tspan></text><path d="M107.43744,87.87272h173.59267" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Magic</tspan></text></g></g></svg>