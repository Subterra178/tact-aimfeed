<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="424.65857" height="201.99142" viewBox="0,0,424.65857,201.99142"><g transform="translate(-15.03011,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03012,115.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は水晶玉を</tspan><tspan x="0" dy="46.150000000000006px">用いることで</tspan><tspan x="0" dy="46.150000000000006px">遠くの敵も索敵できる</tspan><tspan x="0" dy="46.150000000000006px">遠距離魔法武器だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">ホーミング力はない</tspan><tspan x="0" dy="46.150000000000006px">代わりに、連射、威力</tspan><tspan x="0" dy="46.150000000000006px">は並大抵の銃よりも</tspan><tspan x="0" dy="46.150000000000006px">高水準だぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">遠距離から敵を狙って</tspan><tspan x="0" dy="46.150000000000006px">仕留めていけると</tspan><tspan x="0" dy="46.150000000000006px">強いぜ。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03011,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Magic</tspan></text><path d="M107.43746,87.87272h173.59267" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03012,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Crystal ball</tspan></text></g></g></svg>