<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="190.90097" viewBox="0,0,436.23145,190.90097"><g transform="translate(-15.03011,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03009,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Mini bomb</tspan></text><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは２回に分けて</tspan><tspan x="0" dy="46.150000000000006px">爆発を起こせるのが</tspan><tspan x="0" dy="46.150000000000006px">特徴です。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">他のボムに比べて</tspan><tspan x="0" dy="46.150000000000006px">リロードも早く、２回に</tspan><tspan x="0" dy="46.150000000000006px">分けられるから、とても</tspan><tspan x="0" dy="46.150000000000006px">使いやすいサブです。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">チャンスを見つけてボム</tspan><tspan x="0" dy="46.150000000000006px">を投げ、確実に攻撃</tspan><tspan x="0" dy="46.150000000000006px">できる人にお勧めです。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Bomb</tspan></text><path d="M107.70369,87.87272h173.32644" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>