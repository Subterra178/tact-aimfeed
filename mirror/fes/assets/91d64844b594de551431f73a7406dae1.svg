<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="424.88549" height="203.99142" viewBox="0,0,424.88549,203.99142"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03013,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は構えると</tspan><tspan x="0" dy="46.150000000000006px">チャージされて強力な</tspan><tspan x="0" dy="46.150000000000006px">攻撃を放てるのが</tspan><tspan x="0" dy="46.150000000000006px">特徴だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">弾速も無限で強力</tspan><tspan x="0" dy="46.150000000000006px">だけどレーザーサイト</tspan><tspan x="0" dy="46.150000000000006px">で位置が分かっちゃう</tspan><tspan x="0" dy="46.150000000000006px">から注意しろよな。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">戦場に強烈な一撃を</tspan><tspan x="0" dy="46.150000000000006px">与えたい人にお勧め</tspan><tspan x="0" dy="46.150000000000006px">の武器だぜ！</tspan></text><text transform="translate(326.03013,100.87004) scale(0.4146,0.4146)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Laser cannon</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03011,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Sniper</tspan></text><path d="M112.03143,87.87272h168.99868" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>