<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="447.01015" height="183.05805" viewBox="0,0,447.01015,183.05805"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは安全な時に</tspan><tspan x="0" dy="48px">回復したければ</tspan><tspan x="0" dy="48px">使いましょう。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">回復速度は遅いので</tspan><tspan x="0" dy="48px">戦闘中は使えないですが、</tspan><tspan x="0" dy="48px">音が小さいので、茂みの</tspan><tspan x="0" dy="48px">中で使うと強いです。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">狙撃手が使うと</tspan><tspan x="0" dy="48px">良いかもしれませんね。</tspan></text><text transform="translate(326.03013,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Regen tablet</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Heal</tspan></text><path d="M281.03016,87.87272h-186.70844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>