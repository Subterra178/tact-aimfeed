<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="413.53946" height="151.62962" viewBox="0,0,413.53946,151.62962"><g transform="translate(-15.0301,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このジャンルは</tspan><tspan x="0" dy="46.150000000000006px">武器を構えることで</tspan><tspan x="0" dy="46.150000000000006px">特殊効果が発動する</tspan><tspan x="0" dy="46.150000000000006px">のが特徴だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">１つの武器で様々な</tspan><tspan x="0" dy="46.150000000000006px">効果を持つから、</tspan><tspan x="0" dy="46.150000000000006px">武器枠が足りない</tspan><tspan x="0" dy="46.150000000000006px">人にお勧めだ。</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Dual</tspan></text><path d="M95.3312,87.87272h185.69891" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Dual</tspan></text></g></g></svg>