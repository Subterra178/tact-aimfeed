<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="434.4161" height="177.81051" viewBox="0,0,434.4161,177.81051"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">AK-47</tspan></text><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は大量生産に</tspan><tspan x="0" dy="46.150000000000006px">よって安価になっていて</tspan><tspan x="0" dy="46.150000000000006px">貫通力が高いのが特徴</tspan><tspan x="0" dy="46.150000000000006px">だぜ。 </tspan><tspan x="0" dy="46.150000000000006px">たまに敵に「貫通」</tspan><tspan x="0" dy="46.150000000000006px">デバフを付与して敵に</tspan><tspan x="0" dy="46.150000000000006px">継続ダメージを</tspan><tspan x="0" dy="46.150000000000006px">与えられるぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">クールな銃声も魅力的</tspan><tspan x="0" dy="46.150000000000006px">だな！</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03011,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Rifle</tspan></text><path d="M93.12024,87.87272h187.90988" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>