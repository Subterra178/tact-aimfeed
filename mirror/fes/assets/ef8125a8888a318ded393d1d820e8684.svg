<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="424.88548" height="190.90094" viewBox="0,0,424.88548,190.90094"><g transform="translate(-15.03012,-73.76651)"><g stroke-miterlimit="10"><text transform="translate(326.03013,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">TA shot gun</tspan></text><text transform="translate(326.03013,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">この武器は拡散する</tspan><tspan x="0" dy="46.150000000000006px">範囲が大きいのが</tspan><tspan x="0" dy="46.150000000000006px">特徴だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">当たりやすい代わりに</tspan><tspan x="0" dy="46.150000000000006px">射程が短いから、</tspan><tspan x="0" dy="46.150000000000006px">近距離戦に</tspan><tspan x="0" dy="46.150000000000006px">向いているぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">急接近してきた敵を</tspan><tspan x="0" dy="46.150000000000006px">安定して対処したい</tspan><tspan x="0" dy="46.150000000000006px">人にお勧めだぜ。</tspan></text><path d="M31.03013,87.87275h-13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49064) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Shotgun</tspan></text><path d="M131.28688,87.87275h149.74321" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>