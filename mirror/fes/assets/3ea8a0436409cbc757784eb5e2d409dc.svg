<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="183.05805" viewBox="0,0,436.23145,183.05805"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは２回に</tspan><tspan x="0" dy="48px">分けて大きく回復できる</tspan><tspan x="0" dy="48px">のが特徴です。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">使う手順が複雑だから</tspan><tspan x="0" dy="48px">使うとデバフが入るが、</tspan><tspan x="0" dy="48px">態勢の立て直しには</tspan><tspan x="0" dy="48px">使いやすいです。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">茂みの中で回復したい人</tspan><tspan x="0" dy="48px">にお勧めです。</tspan></text><text transform="translate(326.03011,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Heal kit</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Heal</tspan></text><path d="M94.3217,87.87272h186.70844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>