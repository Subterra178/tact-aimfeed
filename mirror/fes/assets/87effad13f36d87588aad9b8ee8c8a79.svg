<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.44159" height="177.11547" viewBox="0,0,436.44159,177.11547"><g transform="translate(-15.03011,-73.4814)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(326.03012,116.18881) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">このサブは地雷のモデル</tspan><tspan x="0" dy="46.15px">の中でも珍しい、指向性</tspan><tspan x="0" dy="46.15px">の地雷だぜ。</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">一方向にしか爆撃しない</tspan><tspan x="0" dy="46.15px">代わりに、威力と射程が</tspan><tspan x="0" dy="46.15px">凄い自慢の一品だぜ。</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">指向性の地雷だから、</tspan><tspan x="0" dy="46.15px">使用するときは向きに</tspan><tspan x="0" dy="46.15px">気を付けるんだぜ。</tspan></text><text transform="translate(326.03013,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Claymore</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejo