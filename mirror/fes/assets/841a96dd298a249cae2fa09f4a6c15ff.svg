<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23148" height="203.99142" viewBox="0,0,436.23148,203.99142"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03012,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このジャンルは主に丸い</tspan><tspan x="0" dy="46.150000000000006px">範囲攻撃なのが特徴です</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">壁を貫通するものも多い</tspan><tspan x="0" dy="46.150000000000006px">ので、壁の向こうにいる</tspan><tspan x="0" dy="46.150000000000006px">敵を動かすことも</tspan><tspan x="0" dy="46.150000000000006px">できますね。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">４つ編成に入れて超範囲</tspan><tspan x="0" dy="46.150000000000006px">攻撃をしてもよし、少し</tspan><tspan x="0" dy="46.150000000000006px">いれて、敵をうまく</tspan><tspan x="0" dy="46.150000000000006px">動かしながら</tspan><tspan x="0" dy="46.150000000000006px">戦ってもよしです。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Bomb</tspan></text><path d="M281.03013,87.87272h-173.32644" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03013,100.28667) scale(0.46321,0.46321)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Bomb</tspan></text></g></g></svg>