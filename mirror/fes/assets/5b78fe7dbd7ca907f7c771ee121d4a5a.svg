<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="183.05805" viewBox="0,0,436.23145,183.05805"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブはいろんなバフ</tspan><tspan x="0" dy="48px">を長時間かけられるのが</tspan><tspan x="0" dy="48px">特徴です。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">多様なバフがあるので</tspan><tspan x="0" dy="48px">常に有利に戦いたい人に</tspan><tspan x="0" dy="48px">おすすめです。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">攻撃されたときに</tspan><tspan x="0" dy="48px">使ったら敵が許して</tspan><tspan x="0" dy="48px">くれるかもしれませんね</tspan></text><text transform="translate(326.03013,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Treat</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Buff</tspan></text><path d="M94.32171,87.87272h186.70844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>