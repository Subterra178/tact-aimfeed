<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="183.05804" viewBox="0,0,436.23145,183.05804"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブはチームで</tspan><tspan x="0" dy="48px">視野を広げられます。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">効果は小さいが多くの</tspan><tspan x="0" dy="48px">プレイヤーの視野を</tspan><tspan x="0" dy="48px">広げられるから一方的</tspan><tspan x="0" dy="48px">に集中砲火できますよ。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">チームで使えば</tspan><tspan x="0" dy="48px">難攻不落の砦が築ける</tspan><tspan x="0" dy="48px">かもしれませんね</tspan></text><text transform="translate(326.03013,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Vision tower</tspan></text><path d="M18.03011,87.87273h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49062) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Team</tspan></text><path d="M102.32173,87.87273h178.70844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>