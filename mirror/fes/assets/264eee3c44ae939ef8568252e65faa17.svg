<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="458.92347" height="178.11436" viewBox="0,0,458.92347,178.11436"><g transform="translate(-15.0301,-73.46264)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は連射できて</tspan><tspan x="0" dy="46.15px">弾が拡散するのが特徴だよ。</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">威力は少し低いけど、</tspan><tspan x="0" dy="46.15px">正気度をかなり下げるから</tspan><tspan x="0" dy="46.15px">戦闘を有利に進めることが</tspan><tspan x="0" dy="46.15px">できるよ。</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">ただし、使うとたまに</tspan><tspan x="0" dy="46.15px">デバフがつくから</tspan><tspan x="0" dy="46.15px">使いすぎには注意してね。</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Nightmare</tspan></text><path d="M150.3312,87.87272h130.69891" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,101.08873) scale(0.39637,0.39637)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Dark matter</tspan></text></g></g></svg>