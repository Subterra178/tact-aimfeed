<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="424.88548" height="177.81051" viewBox="0,0,424.88548,177.81051"><g transform="translate(-15.0301,-73.76647)"><g stroke-miterlimit="10"><path d="M18.0301,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Magic</tspan></text><path d="M107.43744,87.87272h173.59267" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Magic stick</tspan></text><text transform="translate(326.03011,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は葉っぱを</tspan><tspan x="0" dy="46.150000000000006px">高頻度で飛ばして攻撃</tspan><tspan x="0" dy="46.150000000000006px">するぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">自然回復速度のほうが</tspan><tspan x="0" dy="46.150000000000006px">上回るほどの代償しか</tspan><tspan x="0" dy="46.150000000000006px">払わないから誰でも</tspan><tspan x="0" dy="46.150000000000006px">使えるぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">軽量だからスペル用に</tspan><tspan x="0" dy="46.150000000000006px">ピッタリだな。</tspan></text></g></g></svg>