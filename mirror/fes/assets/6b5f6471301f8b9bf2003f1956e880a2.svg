<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="188.27721" viewBox="0,0,436.23145,188.27721"><g transform="translate(-15.03011,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03009,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Combat rifle</tspan></text><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器はスコープが</tspan><tspan x="0" dy="46.150000000000006px">ついている中でも連射が</tspan><tspan x="0" dy="46.150000000000006px"> できる武器だぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">手数が多いから、</tspan><tspan x="0" dy="46.150000000000006px">遠距離、中距離の戦いで</tspan><tspan x="0" dy="46.150000000000006px">安定して打ち勝つことが</tspan><tspan x="0" dy="46.150000000000006px">できるぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">この武器の強みを理解</tspan><tspan x="0" dy="46.150000000000006px">できたら、立派な上級者</tspan><tspan x="0" dy="46.150000000000006px">だな。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03011,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Rifle</tspan></text><path d="M93.12023,87.87272h187.90988" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>