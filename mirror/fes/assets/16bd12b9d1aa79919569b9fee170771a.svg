<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="424.88548" height="190.90095" viewBox="0,0,424.88548,190.90095"><g transform="translate(-15.03012,-73.7665)"><g stroke-miterlimit="10"><text transform="translate(326.03013,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">DB shot gun</tspan></text><text transform="translate(326.03013,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は銃身を二本</tspan><tspan x="0" dy="46.150000000000006px">にしたことで、</tspan><tspan x="0" dy="46.150000000000006px">二点バーストを実現</tspan><tspan x="0" dy="46.150000000000006px">したショットガンだぜ</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">威力は低いものの、</tspan><tspan x="0" dy="46.150000000000006px">連射力は高いから</tspan><tspan x="0" dy="46.150000000000006px">外してもリカバリーが</tspan><tspan x="0" dy="46.150000000000006px">効くんだ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">安定した戦闘をしたい</tspan><tspan x="0" dy="46.150000000000006px">人にお勧めだぜ。 </tspan></text><path d="M31.03012,87.87274h-13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49063) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Shotgun</tspan></text><path d="M131.28689,87.87274h149.74321" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>