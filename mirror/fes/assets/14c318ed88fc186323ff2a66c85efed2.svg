<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23148" height="190.90097" viewBox="0,0,436.23148,190.90097"><g transform="translate(-15.03009,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Oct blast</tspan></text><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は連射力が</tspan><tspan x="0" dy="46.150000000000006px">高く、しかも精度が</tspan><tspan x="0" dy="46.150000000000006px">いいのが特徴だぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">でも8点バーストの</tspan><tspan x="0" dy="46.150000000000006px">射撃後は無防備だから、</tspan><tspan x="0" dy="46.150000000000006px">引き際を弁えて戦うの</tspan><tspan x="0" dy="46.150000000000006px">がコツだ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">クセは強いけど、使い</tspan><tspan x="0" dy="46.150000000000006px">こなすことができれば</tspan><tspan x="0" dy="46.150000000000006px">十二分に強い武器だぜ。</tspan></text><path d="M31.03009,87.87272h-13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03009,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Gun</tspan></text><path d="M88.65955,87.87272h192.37055" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>