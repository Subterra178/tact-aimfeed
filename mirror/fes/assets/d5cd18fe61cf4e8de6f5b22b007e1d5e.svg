<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23146" height="164.72007" viewBox="0,0,436.23146,164.72007"><g transform="translate(-15.0301,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このジャンルは攻撃力や</tspan><tspan x="0" dy="46.150000000000006px">弾速が速いのが特徴だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">スコープが付いている</tspan><tspan x="0" dy="46.150000000000006px">武器は狙うだけでなく、</tspan><tspan x="0" dy="46.150000000000006px">敵の位置の把握にも</tspan><tspan x="0" dy="46.150000000000006px">役立つんだぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">遠距離から狙い撃ちして</tspan><tspan x="0" dy="46.150000000000006px">一方的に戦えるぜ。</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Sniper</tspan></text><path d="M112.03142,87.87272h168.99868" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,100.28667) scale(0.46321,0.46321)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Sniper</tspan></text></g></g></svg>