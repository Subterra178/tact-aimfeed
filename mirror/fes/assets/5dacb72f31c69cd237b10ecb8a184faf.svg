<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="439.2735" height="177.81051" viewBox="0,0,439.2735,177.81051"><g transform="translate(-15.03011,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03009,98.84405) scale(0.41676,0.41676)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Poison chakram</tspan></text><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは投げると毒の</tspan><tspan x="0" dy="46.150000000000006px">ガスをまき散らしながら</tspan><tspan x="0" dy="46.150000000000006px">飛んでいきます。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">移動速度と攻撃力が減少</tspan><tspan x="0" dy="46.150000000000006px">するデバフは、</tspan><tspan x="0" dy="46.150000000000006px">敵を撤退させるのに</tspan><tspan x="0" dy="46.150000000000006px">うってつけです。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">敵を逃がしたいときに</tspan><tspan x="0" dy="46.150000000000006px">投げてみてください。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Throw</tspan></text><path d="M112.70369,87.87272h168.32644" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>