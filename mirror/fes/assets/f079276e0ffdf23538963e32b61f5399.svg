<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23149" height="190.90097" viewBox="0,0,436.23149,190.90097"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03013,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">LS sniper rifle</tspan></text><text transform="translate(326.03013,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は攻撃力の高い</tspan><tspan x="0" dy="46.150000000000006px">スナイパーライフルに</tspan><tspan x="0" dy="46.150000000000006px">レーザーサイトを</tspan><tspan x="0" dy="46.150000000000006px">取り付けたタイプだ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">位置がばれる代わりに</tspan><tspan x="0" dy="46.150000000000006px">弾丸が追尾するから、</tspan><tspan x="0" dy="46.150000000000006px">遠距離からの狙撃が</tspan><tspan x="0" dy="46.150000000000006px">いいぞ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">狙撃が得意な人に</tspan><tspan x="0" dy="46.150000000000006px">お勧めだ。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Sniper</tspan></text><path d="M112.03147,87.87272h168.99868" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>