<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="447.57749" height="202.9914" viewBox="0,0,447.57749,202.9914"><g transform="translate(-15.03012,-73.7665)"><g stroke-miterlimit="10"><text transform="translate(326.03013,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Blunderbuss</tspan></text><text transform="translate(326.03013,116.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は銃を改造して</tspan><tspan x="0" dy="46.150000000000006px">銃口を広げることで</tspan><tspan x="0" dy="46.150000000000006px">火力を大幅に上昇させた</tspan><tspan x="0" dy="46.150000000000006px">武器だぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">でも無理やり改造して</tspan><tspan x="0" dy="46.150000000000006px">作ったから、射程は最悪、</tspan><tspan x="0" dy="46.150000000000006px">しかも重いから、上手く</tspan><tspan x="0" dy="46.150000000000006px">立ち回らないと、すぐに</tspan><tspan x="0" dy="46.150000000000006px">やられるぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">足が速いキャラが使う</tspan><tspan x="0" dy="46.150000000000006px">といいな。</tspan></text><path d="M31.03012,87.87274h-13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49063) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Shotgun</tspan></text><path d="M131.28689,87.87274h149.74321" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>