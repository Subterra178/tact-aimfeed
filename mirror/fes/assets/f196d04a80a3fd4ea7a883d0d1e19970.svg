<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="424.88548" height="177.81051" viewBox="0,0,424.88548,177.81051"><g transform="translate(-15.03009,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Rapid gun</tspan></text><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器はピストルの</tspan><tspan x="0" dy="46.150000000000006px">中でもリボルバー式で</tspan><tspan x="0" dy="46.150000000000006px">高い連射速度を実現</tspan><tspan x="0" dy="46.150000000000006px">したモデルだぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">連射できる武器の中</tspan><tspan x="0" dy="46.150000000000006px">でもかなり軽くて、</tspan><tspan x="0" dy="46.150000000000006px">扱いやすい武器だぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">機動力が高いから</tspan><tspan x="0" dy="46.150000000000006px">様々な場面で使えるぜ</tspan></text><path d="M18.03009,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03009,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Gun</tspan></text><path d="M88.65955,87.87272h192.37055" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>