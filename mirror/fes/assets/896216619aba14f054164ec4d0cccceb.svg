<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="190.90097" viewBox="0,0,436.23145,190.90097"><g transform="translate(-15.03011,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブはフィールドに</tspan><tspan x="0" dy="46.150000000000006px">残留し、近づいた</tspan><tspan x="0" dy="46.150000000000006px">プレイヤーを爆破する</tspan><tspan x="0" dy="46.150000000000006px">アイテムです。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">エイム力がない人でも</tspan><tspan x="0" dy="46.150000000000006px">道の真ん中に置いておく</tspan><tspan x="0" dy="46.150000000000006px">だけでダメージが稼げる</tspan><tspan x="0" dy="46.150000000000006px">優れものです。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">他にも逃げ道の確保など</tspan><tspan x="0" dy="46.150000000000006px">様々な用途で使えます。</tspan></text><text transform="translate(326.03013,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Mine</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Trap</tspan></text><path d="M91.70369,87.87272h189.32644" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>