<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.00458" height="126.49824" viewBox="0,0,436.00458,126.49824"><g transform="translate(-15.03011,-73.76649)"><g stroke-miterlimit="10"><text transform="translate(326.03013,117.12691) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">これらは禁忌とされる</tspan><tspan x="0" dy="48px">血の力を帯びた武器だ。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">「流血」デバフを付与</tspan><tspan x="0" dy="48px">できるのが特徴で、</tspan><tspan x="0" dy="48px">相手より優位に立ちつつ</tspan><tspan x="0" dy="48px">攻めていけるぜ。</tspan></text><path d="M18.03011,87.87273h13" fill="none" stroke="#ff0099" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49062) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Blood</tspan></text><path d="M281.03013,87.87273h-173.32644" fill="none" stroke="#ff0099" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03013,100.28668) scale(0.46321,0.46321)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Blood</tspan></text></g></g></svg>