<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="190.90097" viewBox="0,0,436.23145,190.90097"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,98.84405) scale(0.41676,0.41676)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Homing missile</tspan></text><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは強力に追尾</tspan><tspan x="0" dy="46.150000000000006px">するミサイルを発射</tspan><tspan x="0" dy="46.150000000000006px">できるのが特徴です。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">追尾は強力だけど、</tspan><tspan x="0" dy="46.150000000000006px">強力な索敵モジュール</tspan><tspan x="0" dy="46.150000000000006px">が搭載できず、音でしか</tspan><tspan x="0" dy="46.150000000000006px">敵を探知できないから</tspan><tspan x="0" dy="46.150000000000006px">注意して使いましょう。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">追い打ちをかけたい時に</tspan><tspan x="0" dy="46.150000000000006px">おすすめです。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Throw</tspan></text><path d="M112.70369,87.87272h168.32644" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>