<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23146" height="183.30109" viewBox="0,0,436.23146,183.30109"><g transform="translate(-15.03011,-73.48141)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは宙に浮いて</tspan><tspan x="0" dy="48px">防御、移動速度上昇、</tspan><tspan x="0" dy="48px">視野上昇のバフを付与</tspan><tspan x="0" dy="48px">するぜ。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">魔導士は爆発に弱いから</tspan><tspan x="0" dy="48px">使えば耐久力が高まるぜ</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">浮遊して強力な状態で</tspan><tspan x="0" dy="48px">戦いたい魔導士にお勧め</tspan><tspan x="0" dy="48px">だぜ。</tspan></text><text transform="translate(326.03013,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Mage gem</tspan></text><path d="M18.03011,87.87273h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49062) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Spell</tspan></text><path d="M96.82173,87.87273h184.20844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>