<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="424.88546" height="204.23447" viewBox="0,0,424.88546,204.23447"><g transform="translate(-15.0301,-73.4814)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">この武器は大地の力を</tspan><tspan x="0" dy="46.15px">込めた重武器だよ。</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">一発で払う代償が</tspan><tspan x="0" dy="46.15px">すさまじい代わりに、</tspan><tspan x="0" dy="46.15px">壁を貫通して大きく</tspan><tspan x="0" dy="46.15px">なる大岩を放ち、</tspan><tspan x="0" dy="46.15px">敵を蹂躙できるよ。</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">撃った後はかなり体力</tspan><tspan x="0" dy="46.15px">が低くなるから、</tspan><tspan x="0" dy="46.15px">遠距離から狙うのが</tspan><tspan x="0" dy="46.15px">お勧めだよ。</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Magic</tspan></text><path d="M107.43744,87.87272h173.59267" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translat