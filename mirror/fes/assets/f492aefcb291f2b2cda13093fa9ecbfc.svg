<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="177.81051" viewBox="0,0,436.23145,177.81051"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器はライフルの中</tspan><tspan x="0" dy="46.150000000000006px">でも攻撃力が飛びぬけて</tspan><tspan x="0" dy="46.150000000000006px">高いのが特徴だぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">ただ、かなり重量がある</tspan><tspan x="0" dy="46.150000000000006px">から、ボーっとしている</tspan><tspan x="0" dy="46.150000000000006px">とやられてしまうんだ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">上手く武器を切り替えて</tspan><tspan x="0" dy="46.150000000000006px">扱うことができれば無類</tspan><tspan x="0" dy="46.150000000000006px">の強さを発揮するぜ！</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03011,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Rifle</tspan></text><path d="M281.03012,87.87272h-187.90988" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03013,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Matchlock</tspan></text></g></g></svg>