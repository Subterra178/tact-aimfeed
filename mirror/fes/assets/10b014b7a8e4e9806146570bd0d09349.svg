<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="214.5835" viewBox="0,0,436.23145,214.5835"><g transform="translate(-15.03011,-73.4814)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このジャンルのサブは</tspan><tspan x="0" dy="46.150000000000006px">体力などの代償を払う</tspan><tspan x="0" dy="46.150000000000006px">ことで他のサブでは付与</tspan><tspan x="0" dy="46.150000000000006px">できないような強力な</tspan><tspan x="0" dy="46.150000000000006px">特殊効果を得たり、攻撃</tspan><tspan x="0" dy="46.150000000000006px">を放てるぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">使うと自然回復が早まる</tspan><tspan x="0" dy="46.150000000000006px">マナブーストが起こる。</tspan><tspan x="0" dy="46.150000000000006px">上手く使えると強いな。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">体力が少ないと</tspan><tspan x="0" dy="46.150000000000006px">使えなかったりするから</tspan><tspan x="0" dy="46.150000000000006px">注意してくれよな！</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Spell</tspan></text><text transform="translate(326.03013,100.28667) scale(0.46321,0.46321)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Spell</tspan></text><path d="M96.82172,87.87272h184.20844" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>