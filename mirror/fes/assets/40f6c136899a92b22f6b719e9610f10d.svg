<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="447.57746" height="138.53917" viewBox="0,0,447.57746,138.53917"><g transform="translate(-15.0301,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器はクリスタルから</tspan><tspan x="0" dy="46.150000000000006px">エネルギーを抽出すること</tspan><tspan x="0" dy="46.150000000000006px">で魔法の弾丸を打てる</tspan><tspan x="0" dy="46.150000000000006px">ようにした武器だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">代償を支払って攻撃する</tspan><tspan x="0" dy="46.150000000000006px">ため、色々なところが</tspan><tspan x="0" dy="46.150000000000006px">高性能だぜ。</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Magic</tspan></text><path d="M107.43744,87.87272h173.59267" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Crystal bullet</tspan></text></g></g></svg>