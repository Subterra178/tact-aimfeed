<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="439.65329" height="177.81051" viewBox="0,0,439.65329,177.81051"><g transform="translate(-15.03009,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は一度に二発の</tspan><tspan x="0" dy="46.150000000000006px">スイカの種を発射するぜ</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">威力こそ低いが、</tspan><tspan x="0" dy="46.150000000000006px">弾幕を張ることで相手の</tspan><tspan x="0" dy="46.150000000000006px">自然回復を阻害したり</tspan><tspan x="0" dy="46.150000000000006px">できる。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">そこそこ重たいから</tspan><tspan x="0" dy="46.150000000000006px">敵との距離に気を付けて</tspan><tspan x="0" dy="46.150000000000006px">使うといいぜ。</tspan></text><path d="M18.03009,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03009,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Gun</tspan></text><path d="M88.65955,87.87272h192.37055" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03013,101.07134) scale(0.39783,0.39783)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Watermelon gun</tspan></text></g></g></svg>