<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23146" height="190.90097" viewBox="0,0,436.23146,190.90097"><g transform="translate(-15.0301,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器はナイフの</tspan><tspan x="0" dy="46.150000000000006px">軽量化により二刀流の</tspan><tspan x="0" dy="46.150000000000006px">戦闘スタイルを実現した</tspan><tspan x="0" dy="46.150000000000006px">武器だぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">突進で進む距離が長く、</tspan><tspan x="0" dy="46.150000000000006px">しかもダメージも高い</tspan><tspan x="0" dy="46.150000000000006px">けど、リロードの長さ</tspan><tspan x="0" dy="46.150000000000006px">には気を付けるんだな。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">目にもとまらぬ斬撃で、</tspan><tspan x="0" dy="46.150000000000006px">敵を切り刻め！</tspan></text><path d="M31.0301,87.87272h-13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Strike</tspan></text><path d="M109.3312,87.87272h171.69891" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Butterfly knife</tspan></text></g></g></svg>