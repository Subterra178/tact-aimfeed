<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="164.72007" viewBox="0,0,436.23145,164.72007"><g transform="translate(-15.03011,-73.76649)"><g stroke-miterlimit="10"><text transform="translate(326.03012,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Blood edge</tspan></text><text transform="translate(326.03009,117.12691) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は敵を切り</tspan><tspan x="0" dy="46.150000000000006px">つけることで、「流血」</tspan><tspan x="0" dy="46.150000000000006px">デバフを付与できる</tspan><tspan x="0" dy="46.150000000000006px">優れものだ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">当ててしまえばこちらの</tspan><tspan x="0" dy="46.150000000000006px">もの。デバフを付与し</tspan><tspan x="0" dy="46.150000000000006px">つつ有利に戦えるから、</tspan><tspan x="0" dy="46.150000000000006px">使いこなせば強力な武器</tspan><tspan x="0" dy="46.150000000000006px">だな！</tspan></text><path d="M18.03011,87.87273h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49062) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Blood</tspan></text><path d="M107.70369,87.87273h173.32644" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>