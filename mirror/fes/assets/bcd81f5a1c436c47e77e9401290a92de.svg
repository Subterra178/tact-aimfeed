<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="423.52394" height="196.67325" viewBox="0,0,423.52394,196.67325"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブはガードを</tspan><tspan x="0" dy="48px">３マスにかけて生成</tspan><tspan x="0" dy="48px">できるのが特徴です。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">耐久値も高いので、</tspan><tspan x="0" dy="48px">多くの敵に</tspan><tspan x="0" dy="48px">狙われている時に</tspan><tspan x="0" dy="48px">有効です。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">究極の守りを</tspan><tspan x="0" dy="48px">追及したい人に</tspan><tspan x="0" dy="48px">おすすめです。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Guard</tspan></text><path d="M110.32171,87.87272h170.70844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03013,100.28667) scale(0.46321,0.46321)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Large guard</tspan></text></g></g></svg>