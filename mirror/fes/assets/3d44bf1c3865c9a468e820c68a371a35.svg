<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="435.89111" height="183.05804" viewBox="0,0,435.89111,183.05804"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03013,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは攻撃力を</tspan><tspan x="0" dy="48px">向上させる祭壇を設置</tspan><tspan x="0" dy="48px">します。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">一定の範囲しか効果が</tspan><tspan x="0" dy="48px">ない代わりに、チームで</tspan><tspan x="0" dy="48px">使うと強いです。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">チームで攻撃力を上げて</tspan><tspan x="0" dy="48px">敵を圧倒したい人に</tspan><tspan x="0" dy="48px">お勧めです。</tspan></text><text transform="translate(326.03013,100.68188) scale(0.43028,0.43028)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Power symbol</tspan></text><path d="M18.03011,87.87273h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49062) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Team</tspan></text><path d="M102.32173,87.87273h178.70844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>