<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="447.57746" height="178.11436" viewBox="0,0,447.57746,178.11436"><g transform="translate(-15.0301,-73.46264)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は斬られた者</tspan><tspan x="0" dy="46.150000000000006px">は正気を保てなくなる</tspan><tspan x="0" dy="46.150000000000006px">伝説の魔剣だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">かなり威力は低いが、</tspan><tspan x="0" dy="46.150000000000006px">失う正気度が半端じゃない</tspan><tspan x="0" dy="46.150000000000006px">から、戦闘を有利にして</tspan><tspan x="0" dy="46.150000000000006px">くれるよ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">近接武器の達人が使うと</tspan><tspan x="0" dy="46.150000000000006px">いいよ。</tspan></text><path d="M31.0301,87.87272h-13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Nightmare</tspan></text><path d="M150.3312,87.87272h130.69891" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,101.08873) scale(0.39637,0.39637)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Soul breaker</tspan></text></g></g></svg>