<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="446.44285" height="169.44284" viewBox="0,0,446.44285,169.44284"><g transform="translate(-15.03011,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブはガードを</tspan><tspan x="0" dy="48px">半円状に生成できるのが</tspan><tspan x="0" dy="48px">特徴です。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">形がいびつな側面の</tspan><tspan x="0" dy="48px">耐久値は低いですが、</tspan><tspan x="0" dy="48px">前方は硬く防衛できます。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">安全に遠距離攻撃を</tspan><tspan x="0" dy="48px">したい人におすすめです。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Guard</tspan></text><path d="M110.32171,87.87272h170.70844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03013,100.28667) scale(0.46321,0.46321)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Circle guard</tspan></text></g></g></svg>