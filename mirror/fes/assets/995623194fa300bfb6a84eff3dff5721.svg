<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="458.4714" height="149.13951" viewBox="0,0,458.4714,149.13951"><g transform="translate(-15.0301,-73.46264)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は遠距離から</tspan><tspan x="0" dy="46.150000000000006px">攻撃できるところが強いよ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">性能がかなり良くて、</tspan><tspan x="0" dy="46.150000000000006px">正気度を大幅に下げるよ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">ただし当てにくいから</tspan><tspan x="0" dy="46.150000000000006px">エイムに自信がある人が</tspan><tspan x="0" dy="46.150000000000006px">使うといいよ。</tspan></text><path d="M31.0301,87.87272h-13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Nightmare</tspan></text><path d="M150.3312,87.87272h130.69891" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,102.21373) scale(0.30262,0.30262)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Nightmare sniper rifle</tspan></text></g></g></svg>