<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="177.81051" viewBox="0,0,436.23145,177.81051"><g transform="translate(-15.03011,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このジャンルは設置して</tspan><tspan x="0" dy="46.150000000000006px">フィールドに残留する</tspan><tspan x="0" dy="46.150000000000006px">のが特徴です。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">狭い道に置いて敵を</tspan><tspan x="0" dy="46.150000000000006px">罠にかけたり、広い所</tspan><tspan x="0" dy="46.150000000000006px">に置いて広範囲を占領</tspan><tspan x="0" dy="46.150000000000006px">するのにいいですよ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">戦略的に敵を倒したい人</tspan><tspan x="0" dy="46.150000000000006px">にお勧めです。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03011,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Trap</tspan></text><path d="M91.70369,87.87272h189.32644" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03013,100.28667) scale(0.46321,0.46321)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Trap</tspan></text></g></g></svg>