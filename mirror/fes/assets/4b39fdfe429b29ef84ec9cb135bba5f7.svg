<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="435.32378" height="169.44284" viewBox="0,0,435.32378,169.44284"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは防御直後に</tspan><tspan x="0" dy="48px">レーザーの反撃を生成</tspan><tspan x="0" dy="48px">できるのが特徴です。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">高い耐久値と、</tspan><tspan x="0" dy="48px">レーザーの反撃で敵を</tspan><tspan x="0" dy="48px">寄せ付けません。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">多くの敵に狙われている</tspan><tspan x="0" dy="48px">時に使ってみては？</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Guard</tspan></text><path d="M110.32171,87.87272h170.70844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03013,100.28667) scale(0.46321,0.46321)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Laser guard</tspan></text></g></g></svg>