<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="446.89671" height="169.44284" viewBox="0,0,446.89671,169.44284"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03011,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは少し回復</tspan><tspan x="0" dy="48px">したい時に使いましょう。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">比較的リロード時間が</tspan><tspan x="0" dy="48px">短いので、戦闘中に使い</tspan><tspan x="0" dy="48px">やすいです。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">戦闘中の回復で一発逆転</tspan><tspan x="0" dy="48px">を狙う人にもってこいの</tspan><tspan x="0" dy="48px">サブです。</tspan></text><text transform="translate(326.03012,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Bandage</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03014,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Heal</tspan></text><path d="M94.32171,87.87272h186.70844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>