<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="424.65855" height="177.81051" viewBox="0,0,424.65855,177.81051"><g transform="translate(-15.0301,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は耐弾性が</tspan><tspan x="0" dy="46.150000000000006px">あるのが特徴だ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">スペースキーで弾丸を</tspan><tspan x="0" dy="46.150000000000006px">大幅に防御できるから</tspan><tspan x="0" dy="46.150000000000006px">防御しながら距離を</tspan><tspan x="0" dy="46.150000000000006px">詰めたり、流れ弾を</tspan><tspan x="0" dy="46.150000000000006px">防いだりできるぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">待ち伏せしたい人に</tspan><tspan x="0" dy="46.150000000000006px">お勧めだぜ。</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Strike</tspan></text><path d="M109.3312,87.87272h171.69891" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03011,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Knight sword</tspan></text></g></g></svg>