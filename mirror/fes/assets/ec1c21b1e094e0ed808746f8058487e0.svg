<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.00455" height="169.44284" viewBox="0,0,436.00455,169.44284"><g transform="translate(-15.03011,-73.76647)"><g stroke-miterlimit="10"><text transform="translate(326.03011,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは防御直後に</tspan><tspan x="0" dy="48px">毒ガスをまき散らすのが</tspan><tspan x="0" dy="48px">特徴です。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">耐久値は低いが、</tspan><tspan x="0" dy="48px">残留する毒ガスで敵を</tspan><tspan x="0" dy="48px">通しません。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">特定の場所を守りたい</tspan><tspan x="0" dy="48px">時に使ってみましょう。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Guard</tspan></text><path d="M110.32172,87.87272h170.70844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03013,100.28667) scale(0.46321,0.46321)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Poison guard</tspan></text></g></g></svg>