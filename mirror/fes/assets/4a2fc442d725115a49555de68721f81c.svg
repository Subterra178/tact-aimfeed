<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="424.88545" height="190.90097" viewBox="0,0,424.88545,190.90097"><g transform="translate(-15.03011,-73.76648)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは広範囲を</tspan><tspan x="0" dy="46.150000000000006px">攻撃できるのが</tspan><tspan x="0" dy="46.150000000000006px">特徴です。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">残留時間も比較的ある</tspan><tspan x="0" dy="46.150000000000006px">から、特定の場所を</tspan><tspan x="0" dy="46.150000000000006px">守りたいときに便利</tspan><tspan x="0" dy="46.150000000000006px">ですよ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">お菓子が欲しい時に</tspan><tspan x="0" dy="46.150000000000006px">使うといいかも</tspan><tspan x="0" dy="46.150000000000006px">しれませんね。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03012,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Bomb</tspan></text><path d="M281.03013,87.87272h-173.32644" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(326.03012,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Trick</tspan></text></g></g></svg>