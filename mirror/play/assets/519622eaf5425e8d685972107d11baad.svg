<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="426.73938" height="204.23447" viewBox="0,0,426.73938,204.23447"><g transform="translate(-15.0301,-73.4814)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">この武器は自分の後ろ</tspan><tspan x="0" dy="46.15px">から毒を帯びた魔法剣</tspan><tspan x="0" dy="46.15px">を出せるよ。</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">一度に二本も剣が出る</tspan><tspan x="0" dy="46.15px">上に、頻度も最上級で</tspan><tspan x="0" dy="46.15px">毒も付きやすいから、</tspan><tspan x="0" dy="46.15px">瞬間火力、継続火力</tspan><tspan x="0" dy="46.15px">共に高く仕上った</tspan><tspan x="0" dy="46.15px">逸品だよ。</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">その代わりに非常に</tspan><tspan x="0" dy="46.15px">体力の消耗が激しいよ</tspan></text><path d="M18.0301,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.0301,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Magic</tspan></text><path d="M107.43744,87.87272h173.59267" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="transla