<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="424.88549" height="191.144" viewBox="0,0,424.88549,191.144"><g transform="translate(-15.03011,-73.4814)"><g stroke-miterlimit="10"><text transform="translate(326.03013,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は</tspan><tspan x="0" dy="46.150000000000006px">静電気力で追尾する</tspan><tspan x="0" dy="46.150000000000006px">イオンを放つ武器だよ</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">大きな音によって</tspan><tspan x="0" dy="46.150000000000006px">生まれる微弱な電荷に</tspan><tspan x="0" dy="46.150000000000006px">反応するから、音を</tspan><tspan x="0" dy="46.150000000000006px">出している敵に有効</tspan><tspan x="0" dy="46.150000000000006px">だよ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">奇襲されたら使って</tspan><tspan x="0" dy="46.150000000000006px">みてね。</tspan></text><text transform="translate(326.03013,100.87004) scale(0.4146,0.4146)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Ion bazooka</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03011,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Launcher</tspan></text><path d="M141.33121,87.87272h139.69891" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>