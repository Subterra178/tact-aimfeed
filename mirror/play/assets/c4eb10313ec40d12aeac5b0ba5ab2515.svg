<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23146" height="203.99142" viewBox="0,0,436.23146,203.99142"><g transform="translate(-15.03011,-73.76648)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(326.03009,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">SI sniper rifle</tspan></text><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">この武器は攻撃力の高い</tspan><tspan x="0" dy="46.15px">スナイパーライフルに</tspan><tspan x="0" dy="46.15px">サイレンサを取り付けた</tspan><tspan x="0" dy="46.15px">タイプだよ。</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">狙撃の際に、音が出ない</tspan><tspan x="0" dy="46.15px">から、奇襲されにくい</tspan><tspan x="0" dy="46.15px">んだ。</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">その代わりに攻撃力が</tspan><tspan x="0" dy="46.15px">少し低いから、エイムに</tspan><tspan x="0" dy="46.15px">自信がある人が使うと</tspan><tspan x="0" dy="46.15px">いいよ。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03011,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" fill-r