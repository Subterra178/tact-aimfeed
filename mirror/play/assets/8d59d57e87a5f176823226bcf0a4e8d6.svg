<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="425.18561" height="164.96312" viewBox="0,0,425.18561,164.96312"><g transform="translate(-15.03009,-73.4814)"><g stroke-miterlimit="10"><text transform="translate(326.03009,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Terra shooter</tspan></text><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">この武器は色の技術を</tspan><tspan x="0" dy="46.150000000000006px">使った弾が見えにくい</tspan><tspan x="0" dy="46.150000000000006px">武器だよ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">威力、連射力ともに</tspan><tspan x="0" dy="46.150000000000006px">弱めだけど、</tspan><tspan x="0" dy="46.150000000000006px">音は出にくいから</tspan><tspan x="0" dy="46.150000000000006px">茂みから攻撃するとき</tspan><tspan x="0" dy="46.150000000000006px">に位置バレしにくく</tspan><tspan x="0" dy="46.150000000000006px">なるよ。</tspan></text><path d="M18.03009,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03009,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Gun</tspan></text><path d="M88.65955,87.87272h192.37055" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>