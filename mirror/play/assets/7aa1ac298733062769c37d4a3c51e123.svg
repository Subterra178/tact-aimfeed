<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23145" height="196.91628" viewBox="0,0,436.23145,196.91628"><g transform="translate(-15.03011,-73.48141)"><g stroke-miterlimit="10"><text transform="translate(326.03009,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは自然回復</tspan><tspan x="0" dy="48px">までの時間を短縮できる</tspan><tspan x="0" dy="48px">のが特徴だ。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">リロード時間は長いが、</tspan><tspan x="0" dy="48px">隠れて使えば全回復だぜ</tspan><tspan x="0" dy="48px">それに使った後は攻撃を</tspan><tspan x="0" dy="48px">受けても自然回復が</tspan><tspan x="0" dy="48px">止まらないこともあるぜ</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">体力を全回復して</tspan><tspan x="0" dy="48px">戦いたい人にお勧めだ。</tspan></text><text transform="translate(326.03012,100.55839) scale(0.44057,0.44057)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Magic stone</tspan></text><path d="M18.03011,87.87273h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49062) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Spell</tspan></text><path d="M96.82173,87.87273h184.20844" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>