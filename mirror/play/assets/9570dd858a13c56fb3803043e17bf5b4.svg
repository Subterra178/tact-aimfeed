<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="436.23147" height="164.96312" viewBox="0,0,436.23147,164.96312"><g transform="translate(-15.03011,-73.4814)"><g stroke-miterlimit="10"><text transform="translate(326.03011,98.84405) scale(0.41676,0.41676)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Warp bomb</tspan></text><text transform="translate(326.03011,117.1269) scale(0.28365,0.28365)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">このサブは素早く</tspan><tspan x="0" dy="46.150000000000006px">瞬間移動できるのが</tspan><tspan x="0" dy="46.150000000000006px">特徴だぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">距離は短い代わりに、</tspan><tspan x="0" dy="46.150000000000006px">移動速度は速いから、</tspan><tspan x="0" dy="46.150000000000006px">回避や逃げで使えるぜ。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">素早い動きで敵を翻弄</tspan><tspan x="0" dy="46.150000000000006px">したい奴にお勧めだぜ。</tspan></text><path d="M18.03011,87.87272h13" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path><text transform="translate(40.03013,95.49061) scale(0.50639,0.50639)" font-size="40" xml:space="preserve" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="butt" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Throw</tspan></text><path d="M112.7037,87.87272h168.32644" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"></path></g></g></svg>